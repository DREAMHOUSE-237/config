server.port=8085

# Eureka
eureka.client.service-url.defaultZone=http://ec2-16-171-110-76.eu-north-1.compute.amazonaws.com:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.hostname=172.31.17.179
eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=172.31.17.179
eureka.instance.instance-id=172.31.17.179:publication-service:8085

# Database
spring.datasource.url=jdbc:mysql://db-dreamhouse.cb2oa2mg0d74.eu-north-1.rds.amazonaws.com:3306/publication_db?sslMode=REQUIRED
spring.datasource.username=${PUBLICATION_DB_USER}
spring.datasource.password=${PUBLICATION_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false

# RabbitMQ
spring.rabbitmq.host=ec2-16-171-110-76.eu-north-1.compute.amazonaws.com
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_USER}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}

# Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=25MB
spring.servlet.multipart.enabled=true

# Tomcat's default connection-timeout (60s) was closing the connection
# while still receiving large multipart uploads (property photos) from
# slow clients, well before the controller even ran - raise it so slow
# uploads have time to fully arrive.
server.tomcat.connection-timeout=180000
file.upload-dir=./uploads
file.supported-types.jpeg=image/jpeg
file.supported-types.jpg=image/jpeg
file.supported-types.png=image/png
file.supported-types.gif=image/gif
file.supported-types.webp=image/webp
file.supported-types.pdf=application/pdf
file.supported-types.docx=application/vnd.openxmlformats-officedocument.wordprocessingml.document

# Email
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Logging
logging.level.root=WARN
logging.level.org.springframework=WARN